<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="DriveSmooth app preview placeholder">
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00040e"/>
      <stop offset="55%" stop-color="#031331"/>
      <stop offset="100%" stop-color="#001b45"/>
    </linearGradient>
    <linearGradient id="ds-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d8cff"/>
      <stop offset="100%" stop-color="#00c3fd"/>
    </linearGradient>
    <linearGradient id="ds-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1428"/>
      <stop offset="100%" stop-color="#050b1a"/>
    </linearGradient>
    <radialGradient id="ds-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0065fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0065fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#ds-bg)"/>
  <g opacity="0.55">
    <circle cx="600" cy="140" r="220" fill="url(#ds-glow)"/>
    <circle cx="140" cy="520" r="200" fill="url(#ds-glow)" opacity="0.5"/>
  </g>

  <!-- road -->
  <path d="M-40 470 C 180 400, 260 560, 520 470 S 820 330, 900 360" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="46" stroke-linecap="round"/>
  <path d="M-40 470 C 180 400, 260 560, 520 470 S 820 330, 900 360" fill="none" stroke="url(#ds-accent)" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="18 22" stroke-linecap="round"/>

  <!-- left copy blocks -->
  <g transform="translate(66 132)">
    <rect width="58" height="58" rx="18" fill="url(#ds-accent)" opacity="0.9"/>
    <path d="M17 36c0-8 5-14 12-14s12 6 12 14" fill="none" stroke="#00040e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="29" cy="40" r="3.5" fill="#00040e"/>
    <rect y="86" width="250" height="16" rx="8" fill="#ffffff" opacity="0.85"/>
    <rect y="118" width="180" height="12" rx="6" fill="#ffffff" opacity="0.35"/>
    <rect y="144" width="210" height="12" rx="6" fill="#ffffff" opacity="0.2"/>

    <g transform="translate(0 200)">
      <rect width="118" height="72" rx="16" fill="#ffffff" opacity="0.06"/>
      <rect x="16" y="18" width="52" height="10" rx="5" fill="#3d8cff" opacity="0.9"/>
      <rect x="16" y="40" width="80" height="14" rx="7" fill="#ffffff" opacity="0.5"/>
      <rect x="134" width="118" height="72" rx="16" fill="#ffffff" opacity="0.06"/>
      <rect x="150" y="18" width="52" height="10" rx="5" fill="#00c3fd" opacity="0.9"/>
      <rect x="150" y="40" width="80" height="14" rx="7" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(452 62)" filter="url(#ds-shadow)">
    <rect width="272" height="480" rx="42" fill="url(#ds-phone)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="100" y="18" width="72" height="10" rx="5" fill="#ffffff" opacity="0.18"/>

    <text x="28" y="70" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#96a1ba">Trip score</text>

    <!-- score ring -->
    <g transform="translate(136 176)">
      <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="14"/>
      <circle r="78" fill="none" stroke="url(#ds-accent)" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="490" stroke-dashoffset="60" transform="rotate(-90)"/>
      <text text-anchor="middle" y="8" font-family="Sora, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#ffffff">92</text>
      <text text-anchor="middle" y="34" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#7fe1ff">Smooth</text>
    </g>

    <!-- stat rows -->
    <g transform="translate(24 296)">
      <rect width="224" height="52" rx="14" fill="#ffffff" opacity="0.05"/>
      <circle cx="30" cy="26" r="12" fill="#3d8cff" opacity="0.25"/>
      <rect x="54" y="14" width="86" height="9" rx="4.5" fill="#ffffff" opacity="0.55"/>
      <rect x="54" y="31" width="120" height="8" rx="4" fill="#ffffff" opacity="0.25"/>

      <g transform="translate(0 64)">
        <rect width="224" height="52" rx="14" fill="#ffffff" opacity="0.05"/>
        <circle cx="30" cy="26" r="12" fill="#00c3fd" opacity="0.25"/>
        <rect x="54" y="14" width="70" height="9" rx="4.5" fill="#ffffff" opacity="0.55"/>
        <rect x="54" y="31" width="132" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
      </g>

      <g transform="translate(0 128)">
        <rect width="224" height="44" rx="14" fill="url(#ds-accent)" opacity="0.9"/>
        <text x="112" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#00040e">Claim 240 points</text>
      </g>
    </g>
  </g>

  <text x="66" y="556" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#ffffff" opacity="0.28">PLACEHOLDER ARTWORK</text>
</svg>
